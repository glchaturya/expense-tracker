<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Expense Tracker — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f2ff;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Plus Jakarta Sans', system-ui;
    }

    .phone {
      width: 360px;
      height: 720px;
      background: white;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
    }

    .hero {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      transition: .8s cubic-bezier(.2,.8,.2,1);
    }

    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,.12);
      border-radius: 45%;
      top: -140px;
      left: -120px;
      animation: rotate 18s linear infinite;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .hero-content {
      color: white;
      padding: 70px 30px;
    }

    .hero h1 {
      font-size: 34px;
      font-weight: 800;
    }

    .hero p {
      margin-top: 12px;
      opacity: .9;
      font-size: 16px;
    }

    .card {
      position: absolute;
      bottom: -420px;
      left: 18px;
      right: 18px;
      background: white;
      border-radius: 32px 32px 0 0;
      padding: 34px;
      transition: .8s cubic-bezier(.2,.8,.2,1);
    }

    .card h2 {
      color: var(--primary);
      margin-bottom: 24px;
      font-size: 24px;
    }

    .input {
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      border: none;
      background: #f5f5fb;
      border-radius: 14px;
      font-family: 'Plus Jakarta Sans', system-ui;
      font-size: 16px;
      transition: background 0.2s ease;
    }

    .input:focus {
      outline: none;
      background: #efefff;
    }

    .remember-section {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .remember-section input {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      cursor: pointer;
    }

    .remember-section label {
      cursor: pointer;
      margin: 0;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 18px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #7c3aed;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e6e6e9;
    }

    .signup-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }

    .signup-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .signup-link a:hover {
      opacity: 0.8;
    }

    .error-message {
      background: #f8d7da;
      color: #842029;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .phone.open .hero {
      height: 250px;
    }

    .phone.open .card {
      bottom: 0;
    }
  </style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="hero">
      <div class="blob"></div>
      <div class="hero-content">
        <h1>Welcome Back</h1>
        <p>Sign in to continue</p>
      </div>
    </div>

    <div class="card">
      <h2>Sign in</h2>
      
      <div class="error-message" id="error-message"></div>

      <form id="login-form">
        <input
          id="email"
          class="input"
          type="email"
          placeholder="Email"
          required />

        <input
          id="password"
          class="input"
          type="password"
          placeholder="Password"
          required />

        <div class="remember-section">
          <input id="remember" type="checkbox" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn">Continue</button>
      </form>

      <div class="divider">or</div>

      <div class="signup-link">
        Don't have an account? <a href="register.html">Sign up here</a>
      </div>
    </div>
  </div>

  <script>
    const LOGIN_KEY = 'expenseTracker.currentUser';
    const USERS_KEY = 'expenseTracker.users';

    function getUsers() {
      const users = localStorage.getItem(USERS_KEY);
      return users ? JSON.parse(users) : [];
    }

    function saveUser(email, password) {
      const users = getUsers();
      const userExists = users.find(u => u.email === email);
      if (userExists) return false;
      users.push({ email, password, createdAt: new Date().toISOString() });
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      return true;
    }

    function verifyUser(email, password) {
      const users = getUsers();
      return users.find(u => u.email === email && u.password === password);
    }

    function setCurrentUser(email) {
      localStorage.setItem(LOGIN_KEY, JSON.stringify({ email, loginTime: new Date().toISOString() }));
    }

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => errorDiv.classList.remove('show'), 4000);
    }

    function animateCard() {
      document.getElementById('phone').classList.add('open');
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      // Demo: If no users exist, auto-create demo account
      if (getUsers().length === 0) {
        saveUser('demo@example.com', 'demo123');
      }

      const user = verifyUser(email, password);
      if (!user) {
        showError('Invalid email or password');
        return;
      }

      setCurrentUser(email);
      if (remember) {
        localStorage.setItem('expenseTracker.rememberMe', 'true');
      }

      window.location.href = 'index.html';
    });

    // Check if user is already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const currentUser = localStorage.getItem(LOGIN_KEY);
      if (currentUser) {
        window.location.href = 'index.html';
      }

      // Auto-fill demo credentials for testing
      const users = getUsers();
      if (users.length === 0) {
        saveUser('demo@example.com', 'demo123');
        document.getElementById('email').value = 'demo@example.com';
        document.getElementById('password').value = 'demo123';
      }

      // Trigger animation on load
      setTimeout(animateCard, 300);
    });
  </script>
</body>
</html>
