<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Expense Tracker — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }
    .login-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(16,24,40,0.04);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-card h1 {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 28px;
      text-align: center;
    }
    .login-card .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #111;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e6e6e9;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', system-ui;
      transition: border-color 0.2s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,14,212,0.1);
    }
    .signup-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
    }
    .signup-btn:hover {
      background: #7c3aed;
    }
    .signup-btn:active {
      transform: scale(0.98);
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--muted);
    }
    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    .login-link a:hover {
      opacity: 0.8;
    }
    .error-message {
      background: #f8d7da;
      color: #842029;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md">
  <div class="login-container">
    <div class="login-card">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Create your account</p>
      
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" placeholder="Re-enter your password" required />
        </div>

        <button type="submit" class="signup-btn">Create Account</button>
      </form>

      <div class="login-link">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </div>

  <script>
    const USERS_KEY = 'expenseTracker.users';

    function getUsers() {
      const users = localStorage.getItem(USERS_KEY);
      return users ? JSON.parse(users) : [];
    }

    function saveUser(email, password) {
      const users = getUsers();
      const userExists = users.find(u => u.email === email);
      if (userExists) return false;
      users.push({ email, password, createdAt: new Date().toISOString() });
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      return true;
    }

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => errorDiv.classList.remove('show'), 4000);
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('success-message');
      successDiv.textContent = message;
      successDiv.classList.add('show');
    }

    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }

      if (!saveUser(email, password)) {
        showError('Email already registered. Please login instead.');
        return;
      }

      showSuccess('Account created successfully! Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });

    // Check if user is already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const currentUser = localStorage.getItem('expenseTracker.currentUser');
      if (currentUser) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
