<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker - Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body data-page="dashboard">
  <header class="topbar">
    <div class="brand">Expense Tracker</div>
    <nav class="nav-links">
      <a href="index.html" class="active">Dashboard</a>
      <a href="goal-booster.html">Goal Booster</a>
      <a href="spending-analysis.html">Spending Analysis</a>
    </nav>
    <div class="profile-section">
      <img id="profile-pic" class="profile-pic" alt="Profile" />
      <input id="profile-upload" type="file" accept="image/*" style="display: none;" />
      <button id="upload-btn" class="upload-btn" title="Upload profile picture">Upload Photo</button>
    </div>
  </header>

  <main class="layout">

    <section class="panel summary-panel">
      <div class="panel-title">Quick Summary</div>
      <div class="card-grid">
        <article class="stat-card">
          <span>Total spent</span>
          <strong id="total-spent">$0.00</strong>
        </article>
        <article class="stat-card">
          <span>Monthly budget</span>
          <strong id="monthly-budget">$1,500</strong>
        </article>
        <article class="stat-card">
          <span>Remaining</span>
          <strong id="remaining-budget">$1,500</strong>
        </article>
      </div>
      <div class="budget-row">
        <label for="budget-input">Update budget</label>
        <input id="budget-input" type="number" min="0" step="10" value="1500" />
        <button id="save-budget">Save</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Add Expense</div>
      <form id="expense-form" class="form-grid">
        <label>
          Description
          <input id="expense-description" type="text" placeholder="Groceries, petrol, rent" required />
        </label>

        <label>
          Amount
          <input id="expense-amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
        </label>

        <label>
          Category
          <select id="expense-category">
            <option value="Food">Food</option>
            <option value="Housing">Housing</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <label>
          Date
          <input id="expense-date" type="date" required />
        </label>

        <button type="submit" class="primary">Add Expense</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-title">Filters & Categories</div>
      <div class="filter-grid">
        <label>
          Category
          <select id="category-filter">
            <option value="All">All</option>
            <option value="Food">Food</option>
            <option value="Housing">Housing</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>
          Sort by
          <select id="sort-order">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="amountHigh">Amount high</option>
            <option value="amountLow">Amount low</option>
          </select>
        </label>
      </div>
    </section>

    <section class="panel expense-panel">
      <div class="panel-title">Expense History</div>
      <div id="expense-list" class="expense-list"></div>
    </section>
  </main>
</body>
</html>
